<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      FrescaGo | ¡Haz tu Pedido Hoy y Disfruta de Frutas y Verduras Frescas!
    </title>
    <meta
      name="description"
      content="FrescaGo es una tienda online de frutas y verduras frescas de agricultores locales. Haz tu pedido hoy y recíbelo en casa."
    />
    <meta name="theme-color" content="#fbf7f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121a15" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FrescaGo" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <script>
      try {
        var theme = localStorage.getItem("frescago-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <noscript>
      FrescaGo necesita JavaScript para funcionar. / FrescaGo needs JavaScript to work.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
